<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RideGo</title>
<style>
:root{--bg:#fff;--ink:#000;--mut:#6b6b6b;--line:#e3e3e3;--fld:#f1f1f1;--btn:#000;--bi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff;--mut:#9a9a9a;--line:#2b2b2b;--fld:#1a1a1a;--btn:#fff;--bi:#000}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:18px 20px 40px;min-height:100vh}
h1{font-size:32px;line-height:1.1;margin:16px 0 6px;letter-spacing:-1px;font-weight:800}h2{font-size:17px;margin:22px 0 10px}
.sub,.sm{color:var(--mut)}.sub{margin:0 0 18px}.sm{font-size:13px}.c{text-align:center}
.back,.link{background:none;border:0;color:var(--ink);font:inherit;padding:8px 0;cursor:pointer}.link{color:var(--mut);text-decoration:underline}
.brand{font-size:44px;font-weight:900;letter-spacing:-2px;margin:70px 0 4px}
.opt{display:block;width:100%;text-align:left;background:var(--fld);border:0;border-radius:16px;padding:20px;margin-bottom:12px;color:var(--ink);font:inherit;cursor:pointer}
.opt b{display:block;font-size:19px}.opt span{color:var(--mut);font-size:14px}
label{display:block;font-weight:600;margin:14px 0 7px}
input,select{width:100%;background:var(--fld);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:15px;font:inherit;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{width:100%;background:var(--btn);color:var(--bi);border:0;border-radius:12px;padding:16px;font:inherit;font-size:16px;font-weight:700;margin-top:20px;cursor:pointer}
.btn.s{padding:11px 14px;margin:0;width:auto;font-size:14px}.btn.o{background:var(--fld);color:var(--ink)}
.err{font-size:14px;margin:10px 0 0;font-weight:600}
.sug{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;cursor:pointer}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:30px;font-weight:800;letter-spacing:-1px}
.tag{display:inline-block;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;background:var(--btn);color:var(--bi)}
.bub{background:var(--fld);border-radius:14px;padding:10px 14px;margin:6px 0;max-width:85%}.bub.me{background:var(--btn);color:var(--bi);margin-left:auto}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--btn);color:var(--bi);border-color:var(--btn)}
.ph{display:flex;gap:8px}.dial{background:var(--fld);border-radius:12px;padding:15px;font-weight:700;display:grid;place-items:center;min-width:72px}.ph input{flex:1}
.chat{max-height:260px;overflow-y:auto}
#mapbox{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.gap{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.gap input{flex:1;min-width:90px;padding:11px}
</style>

function render(){{const o=$('offer');if(o)f.offer=o.value;const q=$('q');if(q)f.q=q.value;const rc=$('rvc');if(rc)f.rvc=rc.value}let h='';const E=msg?`<p class="err">${esc(msg)}</p>`:'';
if(screen==='welcome'){h=`<div class="brand">RideGo</div><p class="sub">Name your price. Ride anywhere.</p><button class="opt" onclick="role='rider';mode='up';go('reg')"><b>I am a Rider</b><span>Book trips and suggest your price</span></button><button class="opt" onclick="role='driver';mode='up';go('reg')"><b>I am a Driver</b><span>Earn money driving riders</span></button><p class="c"><button class="link" onclick="mode='in';go('reg')">I already have an account</button></p>${E}`}
else if(screen==='reg'){const up=mode==='up',c=f.cc||detect(),r=role==='driver'?'Driver':'Rider',ph=via==='phone';
h=`<button class="back" onclick="go('welcome')">&larr; Back</button><h1>${up?r+' sign-up':'Sign in'}</h1><p class="sub">${up?'Your country and currency are detected from your device.':'Welcome back.'}</p><div class="seg" style="margin-bottom:6px"><button class="${ph?'on':''}" onclick="setVia('phone')">Phone number</button><button class="${ph?'':'on'}" onclick="setVia('email')">Email</button></div>`
+(up?`<label>I am a</label><div class="seg"><button class="${r==='Rider'?'on':''}" onclick="setRole('rider')">Rider</button><button class="${r==='Driver'?'on':''}" onclick="setRole('driver')">Driver</button></div>`+fld('n','Full name','Your name'):'')
+((ph||up)?`<label for="cc">Country</label><select id="cc" onchange="f.cc=this.value;$('dial').textContent=DIAL[this.value];if($('cur'))$('cur').textContent='Currency: '+CC[this.value][1]">${Object.keys(CC).map(k=>`<option value="${k}" ${k===c?'selected':''}>${CC[k][0]} (${DIAL[k]})</option>`).join('')}</select>`+(up?`<p class="sm" id="cur">Currency: ${CC[c][1]}</p>`:'')+`<label for="p">Phone number</label><div class="ph"><span class="dial" id="dial">${DIAL[c]}</span><input id="p" type="tel" inputmode="tel" placeholder="71 000 0000" value="${esc(f.p||'')}" autocomplete="off"></div>`:'')
+(ph?'':fld('e','Email','you@example.com','email'))
+fld('pw',up?'Create a password':'Password','6+ characters','password')
+E+`<button class="btn" onclick="authGo()">${up?'Create '+r+' Account':'Sign in'}</button><p class="c"><button class="link" onclick="cap();mode=mode==='up'?'in':'up';role=role||'rider';go('reg')">${up?'I already have an account':'Create a new account'}</button></p>${!up&&!ph?`<p class="c"><button class="link" onclick="cap();go('forgot')">Forgot password?</button></p>`:''}${!up&&ph?'<p class="sm c">Forgot your password? Please contact RideGo support.</p>':''}`}
else if(screen==='forgot'){h=`<button class="back" onclick="cap();mode='in';go('reg')">&larr; Back</button><h1>Reset password</h1><p class="sub">Enter your email and we will send you a link to set a new password.</p>${fld('e','Email','you@example.com','email')}${E}<button class="btn" onclick="sendReset()">Send reset link</button>`}
else if(screen==='newpw'){h=`<h1>New password</h1><p class="sub">Choose a new password for your account.</p>${fld('pw','New password','6+ characters','password')}${E}<button class="btn" onclick="setPw()">Save password</button>`}
else if(screen==='complete'){const c=f.cc||detect(),r=role==='driver'?'Driver':'Rider';
h=`<h1>Finish your profile</h1><p class="sub">Your account is confirmed. Tell us a little more to continue.</p><label>I am a</label><div class="seg"><button class="${r==='Rider'?'on':''}" onclick="setRole('rider')">Rider</button><button class="${r==='Driver'?'on':''}" onclick="setRole('driver')">Driver</button></div>`+fld('n','Full name','Your name')+`<label for="cc">Country</label><select id="cc" onchange="f.cc=this.value;$('dial').textContent=DIAL[this.value]">${Object.keys(CC).map(k=>`<option value="${k}" ${k===c?'selected':''}>${CC[k][0]} (${DIAL[k]})</option>`).join('')}</select><label for="p">Phone number</label><div class="ph"><span class="dial" id="dial">${DIAL[c]}</span><input id="p" type="tel" inputmode="tel" placeholder="71 000 0000" value="${esc(f.p||'')}" autocomplete="off"></div>${E}<button class="btn" onclick="finish()">Continue</button><p class="c"><button class="link" onclick="signOut()">Sign out</button></p>`}
else if(screen==='otp'){h=`<button class="back" onclick="go('reg')">&larr; Back</button><h1>Enter code</h1><p class="sub">We sent a code by SMS to ${esc(f.phone)}.</p>${fld('code','6-digit code','123456','tel')}${E}<button class="btn" onclick="verify()">Verify and continue</button><p class="c"><button class="link" onclick="authGo()">Resend code</button></p>`}
else if(screen==='rHome'){const r=R[0];h=`<h1>Where to?</h1><p class="sub">${esc(me.name.split(' ')[0])}, prices are in ${me.currency}.</p>`;
if(r){h+=`<div class="card"><div class="row"><span class="tag">${r.status==='accepted'?'Driver on the way':'Waiting for bids'}</span><span class="big">${money(r.final_price||r.rider_offer,r.currency)}</span></div><p><b>${esc(r.from_place)}</b><br><span class="sm">to</span> <b>${esc(r.to_place)}</b></p>${r.status==='accepted'?`<p class="sm">Driver: ${esc(r.driver_name)}</p>`:''}</div>`;
h+='<div id="mapslot"></div>';if(r.status==='open'){h+=`<h2>Negotiation</h2><div class="bub me">You offered ${money(r.rider_offer,r.currency)}</div>`+(B.length?B.map(b=>`<div class="bub">${esc(b.driver_name)} <span class="sm" style="color:inherit">${rt(b.driver_id)}</span> bids ${money(b.amount,r.currency)}</div>${b.counter?`<div class="bub me">You countered ${money(b.counter,r.currency)}</div>`:''}<div class="gap"><button class="btn s" onclick="rAcc(B.find(x=>x.id==='${b.id}'))">Accept ${money(b.amount,r.currency)}</button><input id="c_${b.id}" type="number" min="1" placeholder="Counter"><button class="btn s o" onclick="rCtr('${b.id}')">Counter</button></div>`).join(''):'<p class="sm">No bids yet. Drivers nearby can accept or bid higher.</p>')}
if(r.status==='accepted')h+=`<p class="sm">Payment: cash to the driver.</p>`+chatBox(r.id);
h+=`${E}<button class="btn o" onclick="setS('${r.id}','cancelled')">Cancel ride</button>`}
else h+=ratingCard()+`<div id="mapslot"></div>${gpsErr?`<p class="err">${esc(gpsErr)}</p>`:''}<div class="seg" style="margin:10px 0"><button class="${pm==='from'?'on':''}" onclick="pm='from';render()">Pickup</button><button class="${pm==='to'?'on':''}" onclick="pm='to';render()">Destination</button></div><p class="sm" style="margin:0 0 8px">Tap the map to set your <b>${pm==='from'?'pickup':'destination'}</b>, search, or use your location.</p><div class="gap"><button class="btn s" onclick="useGps()">Use my location</button></div><div class="gap"><input id="q" type="text" placeholder="Search a place or address" value="${esc(f.q||'')}" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn s o" onclick="doSearch()">Search</button></div>${SR.map((x,i)=>`<button type="button" class="opt" style="padding:12px;margin:6px 0" onclick="pickRes(${i})"><span>${esc(x.label)}</span></button>`).join('')}<div class="card" style="margin-top:12px"><p class="sm" style="margin:0">Pickup</p><b>${pk?esc(pk.label):'Not set'}</b><p class="sm" style="margin:8px 0 0">Destination</p><b>${ds?esc(ds.label):'Not set'}</b></div>${fld('offer','Suggest your price ('+me.currency+')','e.g. 80','number')}<label>Pay with</label><div class="seg"><button class="on">Cash</button><button disabled style="opacity:.45">Card (coming soon)</button></div>${E}<button class="btn" onclick="send()">Send Request</button>`;
h+=`<p class="c"><button class="link" onclick="signOut()">Sign out</button></p>`}
else if(screen==='dHome'){h=`<h1>Ride requests</h1><p class="sub">Open requests in ${CC[me.country][0]} (${me.currency}).</p>`+ratingBox();
if(J)h+='<div id="mapslot"></div>';
if(J)h+=`<div class="card"><div class="row"><span class="tag">In progress</span><span class="big">${money(J.final_price,J.currency)}</span></div><p><b>${esc(J.from_place)}</b><br><span class="sm">to</span> <b>${esc(J.to_place)}</b></p><p class="sm">Your earnings ${money(J.final_price*.85,J.currency)}. RideGo fee ${money(J.commission,J.currency)}.</p><p class="sm"><b>Cash ride:</b> collect ${money(J.final_price,J.currency)} from the rider. The RideGo fee of ${money(J.commission,J.currency)} is owed to RideGo.</p>${gpsErr?`<p class="err">${esc(gpsErr)}</p>`:'<p class="sm">Your location is shared with the rider while this page is open.</p>'}${J.pickup_lat!=null?`<div class="gap"><a class="btn s o" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${J.pickup_lat},${J.pickup_lng}">Navigate to pickup</a><a class="btn s o" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${J.drop_lat},${J.drop_lng}">Navigate to drop-off</a></div>`:''}<button class="btn" style="margin-top:8px" onclick="setS('${J.id}','done')">Complete ride</button></div>`+chatBox(J.id);
h+=E+(R.length?R.map(r=>{const b=MB.find(x=>x.ride_id===r.id);return`<div class="card"><div class="row"><b>${esc(r.from_place)}</b><span class="sm">to ${esc(r.to_place)}</span></div><p class="sm" style="margin:6px 0">Rider offer</p><div class="big">${money(r.rider_offer,r.currency)}</div><p style="margin:8px 0 0"><b>Your earnings ${money(r.rider_offer*.85,r.currency)}</b><br><span class="sm">RideGo fee (15%) ${money(r.rider_offer*.15,r.currency)}</span></p>${b?`<div class="bub me">Your bid ${money(b.amount,r.currency)}</div>${b.counter?`<div class="bub">Rider countered ${money(b.counter,r.currency)}</div>`:''}`:''}<div class="gap">${J?'':`<button class="btn s" onclick="accOffer(R.find(x=>x.id==='${r.id}'))">Accept</button>${b&&b.counter?`<button class="btn s" onclick="dCtr('${r.id}',${b.counter})">Accept ${money(b.counter,r.currency)}</button>`:''}`}<input id="b_${r.id}" type="number" min="1" placeholder="Your bid"><button class="btn s o" onclick="bidUp('${r.id}')">Bid Higher</button></div></div>`}).join(''):'<p class="sm">No requests right now. This page checks for new ones automatically.</p>')+`<p class="c"><button class="link" onclick="signOut()">Sign out</button></p>`}
$('app').innerHTML=h;{const ch=$('chat');if(ch)ch.scrollTop=ch.scrollHeight}drawForScreen();trackSync();
['from','to'].forEach(id=>{const e=$(id);if(e){e.addEventListener('input',()=>sugg(id));e.addEventListener('focus',()=>sugg(id))}})}
setInterval(async()=>{if(!me||busy||(screen!=='rHome'&&screen!=='dHome')||(screen==='rHome'&&!R[0]))return;const a=document.activeElement,t=a&&a.tagName,chat=a&&a.id==='chatin';if(!chat&&(t==='INPUT'||t==='SELECT'))return;const keep=chat?a.value:null;busy=true;try{await refresh();render();if(chat){const c=$('chatin');if(c){c.value=keep;c.focus()}}}catch(e){}busy=false},4000);
const REC=/type=recovery/.test(location.hash+location.search);
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){screen='newpw';render()}});
(async()=>{if(REC)screen='newpw';render();try{const{data:{session}}=await sb.auth.getSession();if(session&&!REC)await start(session.user)}catch(e){}})();
</script></body></html>
