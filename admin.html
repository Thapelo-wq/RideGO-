<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>RideGo Admin</title>
<style>
:root{--bg:#fff;--ink:#000;--mut:#6b6b6b;--line:#e3e3e3;--fld:#f1f1f1;--btn:#000;--bi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff;--mut:#9a9a9a;--line:#2b2b2b;--fld:#1a1a1a;--btn:#fff;--bi:#000}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:30px;margin:14px 0 6px;letter-spacing:-1px;font-weight:800}h2{font-size:17px;margin:22px 0 8px}
.sm{color:var(--mut);font-size:13px}label{display:block;font-weight:600;margin:14px 0 7px}
input,select{width:100%;background:var(--fld);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:14px;font:inherit;font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{width:100%;background:var(--btn);color:var(--bi);border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;margin-top:18px;cursor:pointer}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:8px 0}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.cols{display:flex;gap:12px}.cols .card{flex:1}
.big{font-size:28px;font-weight:800;letter-spacing:-1px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
</head><body><div id="app"></div>
<script>
const sb=supabase.createClient('https://vqrwgbpiyvsjqhnrtsmw.supabase.co','sb_publishable_HkXsQJjuJFW647mU0mQbAA_9qqaT2KZ');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(n)}catch(e){return c+' '+(+n).toFixed(2)}};
let rides=[],users=[],cf='ALL',msg='',ok=false;
function login(){return `<h1>RideGo Admin</h1><p class="sm">Authorised access only.</p><label for="e">Email</label><input id="e" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">${msg?`<p><b>${esc(msg)}</b></p>`:''}<button class="btn" onclick="signIn()">Sign in</button>`}
async function signIn(){msg='';const{error}=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('pw').value});if(error){msg=error.message;return draw()}await load()}
async function load(){const a=await sb.rpc('is_admin');if(a.error||a.data!==true){await sb.auth.signOut();ok=false;msg='This account is not an admin.';return draw()}
const r=await sb.from('rides').select('*').order('created_at',{ascending:false}),u=await sb.from('profiles').select('*').order('created_at',{ascending:false});
rides=r.data||[];users=u.data||[];ok=true;msg='';draw()}
const tbl=a=>a.length?`<div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Country</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.country)}</td></tr>`).join('')}</table></div>`:'<p class="sm">None yet.</p>';
function draw(){if(!ok){$('app').innerHTML=login();return}
const rs=rides.filter(r=>cf==='ALL'||r.country===cf),us=users.filter(x=>cf==='ALL'||x.country===cf),paid=rs.filter(r=>r.status==='accepted'||r.status==='done'),by={};
paid.forEach(r=>by[r.currency]=(by[r.currency]||0)+Number(r.commission));
const cs=[...new Set(users.map(x=>x.country).concat(rides.map(r=>r.country)))].sort();
$('app').innerHTML=`<h1>Dashboard</h1><label for="cf">Country</label><select id="cf" onchange="cf=this.value;draw()"><option value="ALL">All countries</option>${cs.map(k=>`<option value="${k}" ${k===cf?'selected':''}>${k}</option>`).join('')}</select>
<div class="cols" style="margin-top:16px"><div class="card"><span class="sm">Total rides</span><div class="big">${rs.length}</div></div><div class="card"><span class="sm">Accepted or done</span><div class="big">${paid.length}</div></div></div>
<div class="card"><span class="sm">RideGo 15% earnings</span>${Object.keys(by).length?Object.keys(by).map(c=>`<div class="big">${money(by[c],c)}</div>`).join(''):'<div class="big">0</div>'}<span class="sm">Totals are kept per currency. No exchange rates are applied.</span></div>
<h2>Drivers</h2>${tbl(us.filter(x=>x.role==='driver'))}<h2>Riders</h2>${tbl(us.filter(x=>x.role==='rider'))}
<h2>Recent rides</h2><div class="tw"><table><tr><th>From</th><th>To</th><th>Offer</th><th>Final</th><th>Status</th></tr>${rs.slice(0,30).map(r=>`<tr><td>${esc(r.from_place)}</td><td>${esc(r.to_place)}</td><td>${money(r.rider_offer,r.currency)}</td><td>${r.final_price?money(r.final_price,r.currency):'-'}</td><td>${esc(r.status)}</td></tr>`).join('')}</table></div>
<button class="btn" onclick="load()">Refresh</button><p style="text-align:center"><button class="link" onclick="sb.auth.signOut().then(()=>{ok=false;draw()})">Sign out</button></p>`}
setInterval(()=>{if(ok&&document.activeElement.tagName!=='SELECT')load()},15000);
(async()=>{draw();try{const{data:{session}}=await sb.auth.getSession();if(session)await load()}catch(e){}})();
</script></body></html>
